<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endurance · Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--g:#004C45;--gd:#00332e;--mint:#C8E6C2;--mint2:#DDEFD9;--bg:#F4F3F0;--card:#fff;--line:#E9E7E2;--line2:#DAD8D3;--tx:#1A1A1A;--mut:#5E5C57;--red:#8A3A12;--redbg:#FBE3D6;--amb:#6B4E00;--ambbg:#FFF1C9;--inp:#FFF7D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;font-weight:800;text-transform:uppercase;margin:0}
h1{font-size:22px;letter-spacing:-.01em}h2{font-size:14px}h3{font-size:13px}
.k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:5px;border:2px solid var(--g);background:var(--g);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--gd);border-color:var(--gd)}
.btn.sec{background:transparent;color:var(--g)}.btn.sec:hover{background:var(--mint2)}
.btn.warn{background:var(--red);border-color:var(--red)}
.btn.mini{min-height:28px;padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:wait}
label.f{display:block;font-size:12px;font-weight:600;margin-bottom:8px}
.in{display:block;width:100%;margin-top:3px;height:34px;border:1px solid var(--line2);border-radius:6px;padding:0 12px;background:var(--inp);color:var(--tx)}
textarea.in{height:auto;min-height:48px;padding:10px 12px}
select.in{padding:0 8px}
.in:focus{outline:2px solid var(--g);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.m{font-variant-numeric:tabular-nums;text-align:right;min-width:90px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.ok{background:var(--mint2);color:var(--gd)}.bad{background:var(--redbg);color:var(--red)}.mid{background:var(--ambbg);color:var(--amb)}.gray{background:#EFEDE8;color:#3A3935}
.kv{font-family:Montserrat,sans-serif;font-weight:800;font-size:20px;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:'Space Mono',monospace;font-size:11px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);background:#FAFAF8}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.den2{display:block}.den2>div+div{margin-top:10px}.den2 .row:last-child{border-bottom:1px solid var(--line)}.den2 .m{min-width:64px}

/* layout */
.shell{display:flex;min-height:100vh;flex-wrap:wrap}
nav.side{flex:1 1 200px;max-width:210px;background:var(--g);color:#fff;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
@media(max-width:900px){nav.side{max-width:none;flex-basis:100%}}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--mint);color:var(--g);display:flex;align-items:center;justify-content:center;font:800 15px Montserrat}
nav.side a{display:flex;gap:12px;align-items:center;padding:7px 10px;border-radius:6px;color:#DCEFD8;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
nav.side a:hover{background:rgba(200,230,194,.12);color:#fff}
nav.side a.on{background:var(--mint);color:var(--gd)}
nav.side a.off{opacity:.5;cursor:default}
nav.side a .nn{font-family:'Space Mono',monospace;font-size:11px}
.who{margin-top:auto;padding:14px 10px;border-top:1px solid rgba(200,230,194,.25);font-size:13px}
nav.side .who a{padding:0;display:inline;font-size:12px;color:var(--mint);font-weight:500}nav.side .who a:hover{background:none;text-decoration:underline}
main{flex:999 1 560px;min-width:0;padding:16px 24px 40px}
@media(max-width:600px){main{padding:12px 16px 40px}}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--tx)}
.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.strip{display:flex;flex-wrap:wrap;gap:12px 32px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin-bottom:12px;font-size:13px}
.strip b{display:block;margin-top:2px}
.demo{background:var(--ambbg);color:var(--amb);font-size:12px;padding:4px 16px;text-align:center}
.demo a{color:var(--amb);font-weight:600;cursor:pointer}
.cnt{width:64px;height:28px;text-align:center;border:1px solid var(--line2);border-radius:6px;background:var(--inp);font-weight:600}
.dark{background:var(--g);color:#fff;border-radius:8px;padding:14px 18px}
.dark .k{color:var(--mint)}
.dark .row{border-color:rgba(200,230,194,.25)}
.note{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13px;color:#3A3935}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,30,28,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:10px;width:min(480px,100%);max-height:92vh;overflow:auto}
.modal.wide{width:min(900px,100%)}
.mh{background:var(--g);color:#fff;padding:12px 18px}
.mh .k{color:var(--mint)}
.mb{padding:14px 18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loading{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"><div class="center"><div class="k">Cargando Endurance…</div></div></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ===== CONFIGURACIÓN: pega aquí la URL /exec de tu Apps Script. Vacío = modo prueba ===== */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTn4NQup3mk-rg8Pw-7SoTTE1jCFWzIt1k07Le4aAl07_Gi9YRmgOGQnIRn7nUNP1F/exec';
</script>
<script>
/* ============================================================
   ENDURANCE · Lógica central (compartida entre Google Apps Script
   y el modo prueba del navegador). No editar en Code.gs ni en
   index.html: se genera desde src/core.js.
   ============================================================ */
var Core = (function () {
  'use strict';

  var VERSION = 'fase2-snacks-1.0';

  var SCHEMA = {
    Usuarios: ['id', 'nombre', 'usuario', 'rol', 'salt', 'hash', 'activo', 'trae_efectivo', 'creado'],
    Sesiones: ['token', 'usuario_id', 'expira'],
    Cajas: ['id', 'fecha', 'estado', 'abrio', 'hora_apertura', 'fondo_contado', 'fondo_esperado', 'dif_apertura', 'obs_apertura',
      'cerro', 'hora_cierre', 'contado_cierre', 'fondo_queda', 'retiro', 'num_reporte',
      'r_efectivo', 'r_tarjeta', 'r_transferencia', 'r_uber', 'r_rappi', 'r_pedidosya', 'r_dryden', 'venta_total',
      'datafono_codigo', 'datafono_total', 'dif_tarjeta', 'ingresos', 'egresos', 'efectivo_calc', 'dif_efectivo',
      'dif_ultimo_turno', 'obs_cierre'],
    Conteos: ['id', 'caja_id', 'tipo', 'hora', 'usuario', 'detalle', 'total', 'acum_efectivo'],
    Movimientos: ['id', 'caja_id', 'tipo', 'grupo', 'categoria', 'detalle', 'monto', 'trajo', 'registro', 'hora'],
    Turnos: ['id', 'caja_id', 'hora', 'entrega', 'recibe', 'acum_efectivo', 'esperado', 'contado', 'diferencia', 'obs'],
    Config: ['clave', 'valor'],
    TiposEgreso: ['grupo', 'nombre', 'activo'],
    Snacks: ['id', 'nombre', 'origen', 'unidad', 'vida_util', 'minimo', 'nombre_caja', 'activo', 'orden'],
    Lotes: ['id', 'snack_id', 'elaborado', 'vence', 'cantidad', 'origen', 'registro', 'trajo', 'hora'],
    MovSnacks: ['id', 'fecha', 'hora', 'snack_id', 'lote_id', 'tipo', 'cantidad', 'motivo', 'detalle', 'registro'],
    ConteosSnacks: ['id', 'fecha', 'hora', 'registro', 'detalle', 'obs', 'fuente_ventas']
  };

  var ROLES = ['Admin', 'Encargado', 'Asistente', 'Comprador'];

  // Quién puede firmar cada acción (se puede ajustar aquí)
  var PERMISOS = {
    caja_abrir: ['Admin', 'Encargado', 'Asistente'],
    mov_registrar: ['Admin', 'Encargado', 'Asistente'],
    turno_cambiar: ['Admin', 'Encargado', 'Asistente'],
    caja_cerrar: ['Admin', 'Encargado'],
    snacks_produccion: ['Admin', 'Encargado', 'Asistente'],
    snacks_recepcion: ['Admin', 'Encargado', 'Asistente'],
    snacks_merma: ['Admin', 'Encargado', 'Asistente'],
    snacks_conteo: ['Admin', 'Encargado', 'Asistente'],
    snacks_stats: ['Admin'],
    snacks_catalogo: ['Admin'],
    historial: ['Admin'],
    equipo: ['Admin'],
    config: ['Admin']
  };

  // Descripción de cada permiso (para la pantalla de Equipo y accesos)
  var PERMISOS_INFO = [
    { a: 'caja_abrir', g: 'Caja', n: 'Abrir la caja' },
    { a: 'mov_registrar', g: 'Caja', n: 'Registrar ingresos y egresos de efectivo' },
    { a: 'turno_cambiar', g: 'Caja', n: 'Hacer el cambio de turno' },
    { a: 'caja_cerrar', g: 'Caja', n: 'Cerrar la caja' },
    { a: 'snacks_produccion', g: 'Snacks', n: 'Registrar producción del local' },
    { a: 'snacks_recepcion', g: 'Snacks', n: 'Recibir productos del centro' },
    { a: 'snacks_merma', g: 'Snacks', n: 'Registrar merma' },
    { a: 'snacks_conteo', g: 'Snacks', n: 'Hacer el conteo de cierre de snacks' },
    { a: 'snacks_stats', g: 'Snacks', n: 'Ver estadísticas de snacks' },
    { a: 'snacks_catalogo', g: 'Snacks', n: 'Editar el catálogo de snacks' },
    { a: 'historial', g: 'Administración', n: 'Ver el historial de caja' },
    { a: 'equipo', g: 'Administración', n: 'Equipo y accesos (usuarios y permisos)' },
    { a: 'config', g: 'Administración', n: 'Configuración (fondo, meta, tipos de egreso)' }
  ];
  var SIEMPRE_ADMIN = ['equipo', 'config'];

  var DENOMINACIONES = [
    { k: 'b20', v: 2000, n: 'Billetes de $20' },
    { k: 'b10', v: 1000, n: 'Billetes de $10' },
    { k: 'b5', v: 500, n: 'Billetes de $5' },
    { k: 'b1', v: 100, n: 'Billetes de $1' },
    { k: 'm100', v: 100, n: 'Monedas de $1' },
    { k: 'm50', v: 50, n: 'Monedas de 50 ¢' },
    { k: 'm25', v: 25, n: 'Monedas de 25 ¢' },
    { k: 'm10', v: 10, n: 'Monedas de 10 ¢' },
    { k: 'm5', v: 5, n: 'Monedas de 5 ¢' },
    { k: 'm1', v: 1, n: 'Monedas de 1 ¢' }
  ];

  var TIPOS_INGRESO = ['Suelto', 'Reposición de fondo', 'Devolución de vuelto de una compra', 'Otro'];

  var EGRESOS_INICIALES = [
    ['Movilización', 'Taxi Eduardo'], ['Movilización', 'Taxi Sory'], ['Movilización', 'Taxi Cata'], ['Movilización', 'Taxi Victor'],
    ['Movilización', 'Pago parqueo Auri'], ['Movilización', 'Parqueo'],
    ['Delivery', 'Pago delivery clientes'],
    ['Compras', 'Compra Comisariato (desde el local)'], ['Compras', 'Compra Tienda'], ['Compras', 'Compra café para máquina'],
    ['Compras', 'Compra de pan masa madre'], ['Compras', 'Compra de botellones Splendor'], ['Compras', 'Compra de harinas'],
    ['Compras', 'Compra líquido lava platos'], ['Compras', 'Compra de tanque de gas'],
    ['Mantenimiento', 'Reparaciones local'], ['Mantenimiento', 'Mantenimiento aires'],
    ['Personal', 'Pago personal domingo'], ['Personal', 'Pago extra Cata'], ['Personal', 'Pago extra Edu'],
    ['Personal', 'Adelanto Cata'], ['Personal', 'Adelanto Edu'], ['Personal', 'Adelanto Victor']
  ];

  var CONFIG_INICIAL = { fondo: 50, meta: 430, local: 'Urdesa', dias_cobertura: 2 };

  // ---------- utilidades ----------
  function Err(msg) { this.message = msg; this.esUsuario = true; }
  function falla(msg) { throw new Err(msg); }

  function txt(x) { return (x === null || x === undefined) ? '' : String(x).trim(); }
  function num(x) { var n = parseFloat(String(x === undefined || x === null ? '' : x).replace(',', '.')); return isFinite(n) ? n : NaN; }
  function cents(x) { var n = num(x); return isFinite(n) ? Math.round(n * 100) : NaN; }
  function dol(c) { return Math.round(c) / 100; }
  function money(c) { var s = (Math.abs(c) / 100).toFixed(2); return (c < 0 ? '−$' : '$') + s; }
  function montoReq(x, campo, permitirCero) {
    var c = cents(x);
    if (!isFinite(c)) falla('Revisa ' + campo + ': escribe solo el número, por ejemplo 12.50.');
    if (c < 0 || (!permitirCero && c === 0)) falla('Revisa ' + campo + ': debe ser mayor que cero.');
    return c;
  }
  function si(x) { return x === true || txt(x).toLowerCase() === 'sí' || txt(x).toLowerCase() === 'si' || txt(x).toLowerCase() === 'true'; }

  // ---------- SHA-256 (sin dependencias, igual en Google y en el navegador) ----------
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, mw = mp(2, 32), res = '', words = [], i, j;
    var str = unescape(encodeURIComponent(ascii));
    var bl = str.length * 8, hash = [], k = [], pc = 0, cand = {};
    for (var c = 2; pc < 64; c++) {
      if (!cand[c]) {
        for (i = 0; i < 313; i += c) cand[i] = c;
        hash[pc] = (mp(c, 0.5) * mw) | 0;
        k[pc++] = (mp(c, 1 / 3) * mw) | 0;
      }
    }
    hash = hash.slice(0, 8);
    str += '\x80';
    while (str.length % 64 - 56) str += '\x00';
    for (i = 0; i < str.length; i++) {
      j = str.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((bl / mw) | 0);
    words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
          (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : '') + b.toString(16); }
    return res;
  }

  // ---------- contexto por petición ----------
  function Ctx(db) {
    this.db = db;
    this.cache = {};
  }
  Ctx.prototype.t = function (tabla) {
    if (!this.cache[tabla]) this.cache[tabla] = this.db.read(tabla);
    return this.cache[tabla];
  };
  Ctx.prototype.add = function (tabla, obj) {
    this.db.append(tabla, obj);
    if (this.cache[tabla]) this.cache[tabla].push(obj);
  };
  Ctx.prototype.upd = function (tabla, clave, valor, patch) {
    this.db.update(tabla, clave, valor, patch);
    delete this.cache[tabla];
  };
  Ctx.prototype.ahora = function () {
    var d = this.db.now();
    var t = new Date(d.getTime() - 5 * 3600 * 1000); // Ecuador UTC-5, sin horario de verano
    return t.toISOString().slice(0, 19).replace('T', ' ');
  };
  Ctx.prototype.id = function (pref) { return pref + this.db.uuid().slice(0, 12); };

  Ctx.prototype.config = function () {
    var c = {};
    var k;
    for (k in CONFIG_INICIAL) c[k] = CONFIG_INICIAL[k];
    this.t('Config').forEach(function (r) { c[r.clave] = r.valor; });
    c.fondo = num(c.fondo); c.meta = num(c.meta);
    return c;
  };
  Ctx.prototype.tiposEgreso = function () {
    var rows = this.t('TiposEgreso').filter(function (r) { return si(r.activo); });
    return rows.map(function (r) { return { grupo: txt(r.grupo), nombre: txt(r.nombre) }; });
  };

  Ctx.prototype.permisos = function () {
    if (this._perm) return this._perm;
    var p = {}, a;
    for (a in PERMISOS) p[a] = PERMISOS[a].slice();
    var fila = this.t('Config').filter(function (r) { return r.clave === 'permisos'; })[0];
    if (fila) {
      try {
        var g = JSON.parse(fila.valor);
        for (a in p) if (Object.prototype.toString.call(g[a]) === '[object Array]') p[a] = g[a].filter(function (r) { return ROLES.indexOf(r) >= 0; });
      } catch (e) { }
    }
    SIEMPRE_ADMIN.forEach(function (k) { if (p[k].indexOf('Admin') < 0) p[k].push('Admin'); });
    this._perm = p;
    return p;
  };
  Ctx.prototype.permisosDe = function (rol) {
    var p = {}, P = this.permisos();
    for (var a in P) p[a] = P[a].indexOf(rol) >= 0;
    return p;
  };

  function publico(u) {
    return { id: u.id, nombre: txt(u.nombre), usuario: txt(u.usuario), rol: txt(u.rol), activo: si(u.activo), trae_efectivo: si(u.trae_efectivo) };
  }

  Ctx.prototype.buscarUsuario = function (usuario) {
    var u = txt(usuario).toLowerCase();
    var r = this.t('Usuarios').filter(function (x) { return txt(x.usuario).toLowerCase() === u; });
    return r[0] || null;
  };
  Ctx.prototype.claveOk = function (u, clave) {
    return 'h' + sha256(txt(u.salt) + '|' + String(clave === undefined ? '' : clave)) === txt(u.hash);
  };
  // Verifica la firma (usuario + contraseña) y el permiso de quien firma
  Ctx.prototype.firma = function (f, accion, etiqueta) {
    f = f || {};
    var quien = etiqueta ? ' (' + etiqueta + ')' : '';
    if (!txt(f.usuario) || !txt(f.clave)) falla('Escribe usuario y contraseña para firmar' + quien + '.');
    var u = this.buscarUsuario(f.usuario);
    if (!u || !si(u.activo) || !this.claveOk(u, f.clave)) falla('Usuario o contraseña incorrectos' + quien + '.');
    if (accion && this.permisos()[accion].indexOf(txt(u.rol)) < 0) falla(txt(u.nombre) + ' no tiene permiso para esta acción' + quien + '.');
    return u;
  };
  Ctx.prototype.sesion = function (token) {
    var t = txt(token);
    if (!t) falla('Tu sesión terminó. Vuelve a entrar.');
    var ahora = this.ahora();
    var s = this.t('Sesiones').filter(function (x) { return txt(x.token) === t; })[0];
    if (!s || txt(s.expira) < ahora) falla('Tu sesión terminó. Vuelve a entrar.');
    var u = this.t('Usuarios').filter(function (x) { return x.id === s.usuario_id; })[0];
    if (!u || !si(u.activo)) falla('Tu usuario está desactivado.');
    return u;
  };
  Ctx.prototype.exigir = function (u, accion) {
    if (this.permisos()[accion].indexOf(txt(u.rol)) < 0) falla('No tienes permiso para esto.');
  };

  function conteoDesde(detalle) {
    var d = {}, total = 0;
    DENOMINACIONES.forEach(function (x) {

<script>

// Pide usuario y contraseña. opts.dos = true pide dos firmas (entrega y recibe)
function firmar(titulo, resumen, opts) {
  opts = opts || {};

function csCalc() {

    var el = $('css_' + s.id); if (!el) return;

        (!venc && !porV && !rep.length ? '<span class="pill ok">Vitrina completa y fresca</span>' : '') +
        (q.conteo_hoy ? '<span class="pill ok">Conteo de cierre hecho</span>' : '') + '</div>';
    });
  });
}

/* ---------- CAJA ---------- */
function vCaja() {
  cargando();
  apiOk('caja_estado').then(function (r) {
    if (!r.ok) return shell('<div class="card">' + esc(r.error) + '</div>');
    S.caja = r;
    if (!r.abierta) return vApertura();
    var a = r.abierta;
    var sub = S.sub && ['mov', 'turno', 'cierre'].indexOf(S.sub) >= 0 ? S.sub : 'mov';
    S.sub = sub;
    var tabs = '<div class="tabs"><button class="' + (sub === 'mov' ? 'on' : '') + '" onclick="ir(\'caja\',\'mov\')">Ingresos y egresos</button><button class="' + (sub === 'turno' ? 'on' : '') + '" onclick="ir(\'caja\',\'turno\')">Cambio de turno</button><button class="' + (sub === 'cierre' ? 'on' : '') + '" onclick="ir(\'caja\',\'cierre\')">Cierre</button></div>';
    var strip = '<div class="strip"><div><span class="k">Abrió la caja</span><b>' + esc(a.abrio) + ' · ' + hora(a.hora_apertura) + ' · fondo ' + fmt(a.fondo) + '</b></div>' +
      a.turnos.map(function (t) { return '<div><span class="k">Cambio de turno</span><b>' + esc(t.entrega) + ' → ' + esc(t.recibe) + ' · ' + hora(t.hora) + '</b></div>'; }).join('') +
      '<div><span class="k">A cargo ahora</span><b>' + esc(a.responsable) + '</b></div></div>';
    var cuerpo = sub === 'mov' ? hMov(r) : sub === 'turno' ? hTurno(r) : hCierre(r);
    shell('<div class="head"><div><div class="k">' + esc(fechaLarga(a.fecha)) + '</div><h1>Caja</h1></div></div>' + tabs + strip + cuerpo);

  });
}

function vApertura() {
  var r = S.caja, u = r.ultima_cerrada;
  shell('<div class="head"><div><div class="k">' + esc(fechaLarga(new Date().toISOString())) + '</div><h1>Apertura de caja</h1></div></div>' +
    '<div class="grid2" style="align-items:start"><div class="card"><h2>Conteo del fondo</h2><p style="font-size:13px;color:var(--mut);margin:4px 0 8px">Cuenta el efectivo que hay en la caja antes de vender.</p>' + htmlConteo('cAp') + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:16px"><div class="card"><h2>Lo que dejó el cierre anterior</h2>' +
    '<div class="row"><div style="flex:1">Cerró la caja</div><b>' + (u ? esc(u.cerro) + ' · ' + esc(u.fecha) + ' ' + hora(u.hora_cierre) : 'Primera apertura') + '</b></div>' +
    '<div class="row"><div style="flex:1">Fondo que quedó</div><div class="m">' + fmt(r.fondo_esperado) + '</div></div>' +
    '<div class="row"><div style="flex:1">Contado ahora</div><div class="m" id="apCont">$0.00</div></div>' +
    '<div class="row"><div style="flex:1;font-weight:700">Diferencia</div><div id="apDif"></div></div>' +
    '<label class="f" style="margin-top:12px">Observación <span style="font-weight:400;color:var(--mut)">(obligatoria si no cuadra)</span><input class="in" id="apObs" placeholder="Faltaban monedas de 10 ¢"></label></div>' +
    '<button class="btn" onclick="hAbrir()">Abrir caja</button></div></div>');
  alCambiarConteo.cAp = function () {
    var t = leerConteo('cAp').total, d = t - r.fondo_esperado;

  };
  alCambiarConteo.cAp();
}
function hAbrir() {
  var c = leerConteo('cAp');
  if (!c.total) return toast('Cuenta el fondo antes de abrir.');
  var obs = $('apObs').value;
  accionFirmada('Abrir caja', 'Fondo contado: <b>' + fmt(c.total) + '</b>', null, function (f) {
    return api('caja_abrir', { firma: f, conteo: c.detalle, obs: obs });
  }, function (r) { toast('Caja abierta por ' + r.firmo + '.'); S.sub = 'mov'; ir('caja'); });
}

function hMov(r) {
  var a = r.abierta;
  var grupos = {};
  r.tipos_egreso.forEach(function (t) { (grupos[t.grupo] = grupos[t.grupo] || []).push(t.nombre); });
  var opt = '<option value="">Elige el tipo de egreso</option>' + Object.keys(grupos).map(function (g) { return '<optgroup label="' + esc(g) + '">' + grupos[g].map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</optgroup>'; }).join('');
  var lista = a.movimientos.slice().reverse().map(function (m) {
    return '<tr><td>' + hora(m.hora) + '</td><td><span class="pill ' + (m.tipo === 'ingreso' ? 'ok' : 'gray') + '">' + (m.tipo === 'ingreso' ? 'Ingreso' : 'Egreso') + '</span></td><td><b>' + esc(m.categoria) + '</b><div style="font-size:12px;color:var(--mut)">' + esc(m.grupo !== 'Ingreso' ? m.grupo : 'Lo trajo ' + m.trajo) + (m.detalle ? ' · ' + esc(m.detalle) : '') + '</div></td><td>' + esc(m.registro) + '</td><td class="n" style="font-weight:600">' + (m.tipo === 'egreso' ? '−' : '+') + fmtD(m.monto).replace('−', '') + '</td></tr>';
  }).join('');
  return '<div class="grid2" style="align-items:start">' +
    '<div class="card"><h2>Registrar egreso</h2><p style="font-size:13px;color:var(--mut);margin:4px 0 12px">Plata que sale de la caja. Regístrala en el momento.</p>' +
    '<label class="f">Tipo de egreso<select class="in" id="egT">' + opt + '</select></label>' +
    '<div class="grid2" style="gap:10px"><label class="f">Monto ($)<input class="in" id="egM" inputmode="decimal" placeholder="3.00"></label><label class="f">Detalle (opcional)<input class="in" id="egD" placeholder="Llevó pedido a Samborondón"></label></div>' +
    '<button class="btn" onclick="hMovReg(\'egreso\')">Registrar egreso</button></div>' +
    '<div class="card"><h2>Registrar ingreso</h2><p style="font-size:13px;color:var(--mut);margin:4px 0 12px">Plata que entra y no es venta. Solo la pueden traer: ' + esc(r.traen_efectivo.join(' o ') || 'nadie autorizado todavía') + '.</p>' +
    '<div class="grid2" style="gap:10px"><label class="f">Tipo<select class="in" id="inT"><option value="">Elige</option>' + r.tipos_ingreso.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></label>' +
    '<label class="f">Lo trajo<select class="in" id="inQ"><option value="">Elige</option>' + r.traen_efectivo.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></label></div>' +
    '<div class="grid2" style="gap:10px"><label class="f">Monto ($)<input class="in" id="inM" inputmode="decimal" placeholder="20.00"></label><label class="f">Detalle (opcional)<input class="in" id="inD" placeholder="Billetes y monedas de $1"></label></div>' +
    '<button class="btn" onclick="hMovReg(\'ingreso\')">Registrar ingreso</button></div></div>' +
    '<div class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline"><h2>Movimientos de hoy</h2><div style="font-size:14px">Ingresos <b>' + fmt(a.ingresos_dia) + '</b> · Egresos <b>' + fmt(a.egresos_dia) + '</b></div></div>' +
    (lista ? '<div class="scroll"><table class="tbl" style="margin-top:8px"><thead><tr><th>Hora</th><th>Tipo</th><th>Detalle</th><th>Registró</th><th class="n">Monto</th></tr></thead><tbody>' + lista + '</tbody></table></div>' : '<p style="color:var(--mut)">Aún no hay movimientos hoy.</p>') + '</div>';
}
function hMovReg(tipo) {
  var d;
  if (tipo === 'egreso') {
    d = { tipo: 'egreso', categoria: $('egT').value, monto: $('egM').value, detalle: $('egD').value };
    if (!d.categoria) return toast('Elige el tipo de egreso.');
  } else {
    d = { tipo: 'ingreso', categoria: $('inT').value, trajo: $('inQ').value, monto: $('inM').value, detalle: $('inD').value };
    if (!d.categoria) return toast('Elige el tipo de ingreso.');
    if (!d.trajo) return toast('Elige quién trajo el efectivo.');
  }
  var c = cents(d.monto);
  if (!isFinite(c) || c <= 0) return toast('Escribe el monto, por ejemplo 3.50.');
  accionFirmada(tipo === 'egreso' ? 'Registrar egreso' : 'Registrar ingreso', '<b>' + esc(d.categoria) + '</b> · ' + fmt(c) + (d.trajo ? ' · lo trajo ' + esc(d.trajo) : '') + (d.detalle ? '<br>' + esc(d.detalle) : ''), null,
    function (f) { return api('mov_registrar', Object.assign({ firma: f }, d)); },
    function (r) { toast((tipo === 'egreso' ? 'Egreso' : 'Ingreso') + ' registrado por ' + r.firmo + '.'); ir('caja', 'mov'); });
}

function hTurno(r) {
  var a = r.abierta, b = a.base;
  var movs = a.movimientos.filter(function (m) { return m.hora >= b.hora; });
  var info = movs.length ? movs.map(function (m) { return '<div class="row" style="padding:6px 0;font-size:13px"><div style="flex:1">' + hora(m.hora) + ' · ' + esc(m.categoria) + (m.trajo ? ' · lo trajo ' + esc(m.trajo) : '') + '</div><div class="m">' + (m.tipo === 'egreso' ? '−' : '+') + fmtD(m.monto) + '</div></div>'; }).join('') : '<div style="font-size:13px;color:var(--mut)">Sin ingresos ni egresos en este turno.</div>';
  return '<div class="grid2" style="align-items:start"><div class="card"><h2>Paso 1 · Conteo de efectivo</h2><p style="font-size:13px;color:var(--mut);margin:4px 0 8px">Cuentan juntos quien entrega y quien recibe.</p>' + htmlConteo('cTu') + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:16px"><div class="card"><h2>Paso 2 · Cuadre del turno</h2><p style="font-size:13px;color:var(--mut);margin:4px 0 8px">Saca el corte parcial y escribe el <b>total de efectivo que muestra la caja</b>. Ese es el valor que debe coincidir con lo contado.</p>' +
    '<div class="row"><div style="flex:1">Efectivo según la caja<div style="font-size:12px;color:var(--mut)">Total acumulado del corte parcial</div></div><input class="in" id="tuA" inputmode="decimal" style="width:120px;margin:0;text-align:right" oninput="tuCalc()"></div>' +
    '<div class="row"><div style="flex:1;font-weight:700">Contado</div><div class="m" id="tuC">$0.00</div></div>' +
    '<div class="row"><div style="flex:1;font-weight:700">Diferencia</div><div id="tuD"></div></div>' +
    '<label class="f" style="margin-top:12px">Observación <span style="font-weight:400;color:var(--mut)">(obligatoria si no cuadra)</span><input class="in" id="tuO"></label>' +
    '<div class="note" style="margin-top:4px"><div style="font-weight:600;margin-bottom:4px">Movimientos del turno · solo para referencia, no se suman ni restan</div>' + info + '</div></div>' +
    '<div class="dark"><h2 style="color:#fff">Paso 3 · Firman los dos</h2><p style="font-size:13px;color:var(--mint);margin:4px 0 12px">Entrega <b>' + esc(a.responsable) + '</b>, que tiene el turno ahora. Desde este momento, cualquier diferencia queda en el turno de quien recibe.</p><button class="btn" style="background:var(--mint);border-color:var(--mint);color:var(--gd);width:100%" onclick="hTurnoReg()">Registrar cambio de turno</button></div></div></div>';
}
function tuCalc() {
  var caja = cents($('tuA').value), cont = leerConteo('cTu').total;
  $('tuC').textContent = fmt(cont);
  $('tuD').innerHTML = isFinite(caja) && cont ? difPill(cont - caja) : '';
}
function initTurno() { alCambiarConteo.cTu = tuCalc; tuCalc(); }
function hTurnoReg() {
  var c = leerConteo('cTu'), acum = $('tuA').value, obs = $('tuO').value;
  if (!c.total) return toast('Haz el conteo de efectivo.');
  if (!isFinite(cents(acum))) return toast('Escribe el total de efectivo que muestra la caja.');

function ciCalc() {

  var ref = v('ci_efectivo'), rta = v('ci_tarjeta'), dt = v('ciDt');
  $('ciEfC').textContent = cont ? fmt(calc) : '—';
  var dEf = calc - ref, dTa = dt - rta;

  $('ciTaD').innerHTML = $('ci_tarjeta').value || $('ciDt').value ? difPill(dTa) : '';
  $('ciR1').innerHTML = cont && $('ci_efectivo').value ? '<b>' + fmt(dEf) + '</b>' : '—';
  $('ciR2').innerHTML = $('ci_tarjeta').value || $('ciDt').value ? '<b>' + fmt(dTa) + '</b>' : '—';

}

}
function cfPintar() {
  var grupos = cfGrupos();
  $('cfT').innerHTML = '<table class="tbl"><thead><tr><th>Grupo</th><th>Nombre</th><th>Activo</th></tr></thead><tbody>' + S.tipos.map(function (t, i) {
    var sel = '<select class="in" style="margin:0;height:36px" onchange="cfGrupo(' + i + ',this.value)">' +
      (t.grupo ? '' : '<option value="" selected>Elige el grupo</option>') +
      grupos.map(function (g) { return '<option' + (g === t.grupo ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') +
      '<option value="__nuevo">+ Nuevo grupo…</option></select>';
    return '<tr><td>' + sel + '</td><td><input class="in" style="margin:0;height:36px" value="' + esc(t.nombre) + '" placeholder="Nombre del egreso" oninput="S.tipos[' + i + '].nombre=this.value"></td><td><input type="checkbox"' + (t.activo ? ' checked' : '') + ' onchange="S.tipos[' + i + '].activo=this.checked" aria-label="Activo"></td></tr>';
  }).join('') + '</tbody></table>';
}
function cfGrupo(i, v) {
  if (v !== '__nuevo') { S.tipos[i].grupo = v; return; }
  abrirModal('<div class="mb"><h2>Nuevo grupo</h2><label class="f" style="margin-top:12px">Nombre del grupo<input class="in" id="ngN" placeholder="Limpieza"></label><div class="err" id="ngE"></div><div style="display:flex;gap:10px"><button class="btn" onclick="cfGrupoOk(' + i + ')">Agregar</button><button class="btn sec" onclick="cerrarModal();cfPintar()">Cancelar</button></div></div>');
}
function cfGrupoOk(i) {
  var g = $('ngN').value.trim();
  if (!g) { $('ngE').textContent = 'Escribe el nombre del grupo.'; return; }
  S.gruposNuevos = (S.gruposNuevos || []).concat([g]);
  S.tipos[i].grupo = g; cerrarModal(); cfPintar();
}
function cfGuardar(b) {
  b.disabled = true;
  api('config_guardar', { fondo: $('cfF').value, meta: $('cfM').value, tipos_egreso: S.tipos }).then(function (r) { b.disabled = false; if (!r.ok) return toast(r.error); toast('Configuración guardada.'); vConfig(); });
}

document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('modal').innerHTML) cerrarModal(); });
// Solo números: enteros en los conteos, montos con hasta 2 decimales
document.addEventListener('input', function (e) {
  var el = e.target;
  if (!el || el.tagName !== 'INPUT') return;
  var v = el.value, n;
  if (el.getAttribute('data-num') === 'int') {
    n = v.replace(/[^0-9]/g, '');
  } else if (el.getAttribute('inputmode') === 'decimal') {
    n = v.replace(/,/g, '.').replace(/[^0-9.]/g, '');
    var i = n.indexOf('.');
    if (i >= 0) n = n.slice(0, i + 1) + n.slice(i + 1).replace(/\./g, '').slice(0, 2);
  } else return;
  if (n !== v) el.value = n;
}, true);
arrancar();
</script>
